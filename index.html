<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 번째 웹사이트</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #333;
    }
    .card {
      width: 100%; max-width: 480px;
      padding: 48px 32px;
      background: #fff; border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .emoji { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 28px; margin-bottom: 12px; color: #4b3b8f; }
    p { font-size: 16px; line-height: 1.7; color: #666; margin-bottom: 28px; }
    .btn {
      display: inline-block; padding: 12px 28px;
      background: #667eea; color: #fff; text-decoration: none;
      border-radius: 999px; font-weight: 600; transition: background 0.2s;
    }
    .btn:hover { background: #764ba2; }
    @media (max-width: 480px) {
      .card { padding: 36px 20px; }
      h1 { font-size: 24px; }
      .emoji { font-size: 52px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji">👋</div>
    <h1>환영합니다!</h1>
    <p>나의 첫 번째 웹사이트에 오신 것을 환영해요.<br>GitHub Pages로 배포한 페이지랍니다.</p>
    <a class="btn" href="https://github.com/gichanno-100/my-first-website">GitHub 보러가기</a>
  </main>
</body>
</html>
